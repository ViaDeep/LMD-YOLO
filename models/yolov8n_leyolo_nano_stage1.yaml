# Stage 1 candidate: official LeYOLO-Nano backbone + effective YOLOv8n neck/head.
# LeYOLO source: https://github.com/LilianHollard/LeYOLO
# LMD_YOLO reference: DOI 10.1109/ACCESS.2025.3557938

nc: 4
depth_multiple: 1.0
width_multiple: 1.0

backbone:
  # [from, repeats, module, args]
  - [-1, 1, LeYOLOConv, [16, 3, 2, "SI"]]                         # 0-P1/2
  - [-1, 1, LeYOLOConv, [16, 1, 1, "SI"]]                         # 1
  - [-1, 1, LeYOLOInvertedBottleneck, [16, 3, 16, false, "SI", 2, false]]  # 2-P2/4
  - [-1, 1, LeYOLOInvertedBottleneck, [32, 3, 96, false, "SI", 2, true]]   # 3
  - [-1, 1, LeYOLOInvertedBottleneck, [32, 3, 96, false, "SI", 1, true]]   # 4-P3/8
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 96, true, "SI", 2, true]]    # 5
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]   # 6
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]   # 7
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]   # 8
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]   # 9-P4/16
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 2, true]]   # 10
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]   # 11
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]   # 12
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]   # 13
  - [-1, 1, SPPF, [96, 5]]                                       # 14-P5/32

head:
  # YOLOv8n effective neck channels/repeats (v8 base scale n: depth=.33, width=.25).
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]                                          # 17
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [64]]                                           # 20-P3/8
  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]                                          # 23-P4/16
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]                                          # 26-P5/32
  - [[20, 23, 26], 1, Detect, [nc]]

