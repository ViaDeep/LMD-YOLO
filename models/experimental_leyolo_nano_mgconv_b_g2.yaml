# Experimental stage-2 variant B: main groups=2; projected residual.
# Derived from yolov8n_leyolo_nano_stage1.yaml. No Detect_DBB.
# Figure 9 supports positions 21 and 24. Kernel/stride/channels are inherited
# from those stage-1 neck convolutions; group=2 and projection are assumptions.
nc: 4
depth_multiple: 1.0
width_multiple: 1.0

backbone:
  - [-1, 1, LeYOLOConv, [16, 3, 2, "SI"]]  # 0
  - [-1, 1, LeYOLOConv, [16, 1, 1, "SI"]]  # 1
  - [-1, 1, LeYOLOInvertedBottleneck, [16, 3, 16, false, "SI", 2, false]]  # 2
  - [-1, 1, LeYOLOInvertedBottleneck, [32, 3, 96, false, "SI", 2, true]]  # 3
  - [-1, 1, LeYOLOInvertedBottleneck, [32, 3, 96, false, "SI", 1, true]]  # 4 P3
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 96, true, "SI", 2, true]]  # 5
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]  # 6
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]  # 7
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]  # 8
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]  # 9 P4
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 2, true]]  # 10
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]  # 11
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]  # 12
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]  # 13
  - [-1, 1, SPPF, [96, 5]]  # 14 P5

head:
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]  # 15
  - [[-1, 9], 1, Concat, [1]]  # 16
  - [-1, 1, C2f, [128]]  # 17
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]  # 18
  - [[-1, 4], 1, Concat, [1]]  # 19
  - [-1, 1, C2f, [64]]  # 20 P3
  - [-1, 1, ExperimentalMGConv, [64, 3, 2, 2]]  # 21, main groups=2
  - [[-1, 17], 1, Concat, [1]]  # 22
  - [-1, 1, C2f, [128]]  # 23 P4
  - [-1, 1, ExperimentalMGConv, [128, 3, 2, 2]]  # 24, main groups=2
  - [[-1, 14], 1, Concat, [1]]  # 25
  - [-1, 1, C2f, [256]]  # 26 P5
  - [[20, 23, 26], 1, Detect, [nc]]  # 27 conventional Detect
