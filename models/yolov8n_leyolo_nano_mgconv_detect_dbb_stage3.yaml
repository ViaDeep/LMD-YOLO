head:
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [64]]
