# Canonical stage 3 of OUR reproduction; six DBBs are not confirmed by LMD_YOLO.
# LeYOLO-Nano + MGConv(groups=2) at neck layers 21/24 + DetectDBB.
# DetectDBB replaces the first 3x3 Conv in each cv2/cv3 tower at P3/P4/P5.
