depth_multiple: 1.0
width_multiple: 1.0
backbone:
  - [-1, 1, LeYOLOConv, [16, 3, 2, "SI"]]
  - [-1, 1, LeYOLOConv, [16, 1, 1, "SI"]]
  - [-1, 1, LeYOLOInvertedBottleneck, [16, 3, 16, false, "SI", 2, false]]
  - [-1, 1, LeYOLOInvertedBottleneck, [32, 3, 96, false, "SI", 2, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [32, 3, 96, false, "SI", 1, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 96, true, "SI", 2, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [64, 5, 192, true, "SI", 1, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 2, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]
  - [-1, 1, LeYOLOInvertedBottleneck, [96, 5, 576, true, "SI", 1, true]]
