experiment: stage7_yolov8n_vs_lmd_yolo_100_epochs
initialization: scratch_both
initialization_rationale: >-
  No external pretrained checkpoint exists for the custom LMD architecture.
  YOLOv8n COCO weights versus an LMD checkpoint already exposed to RDD2022
  would be asymmetric, so both models are constructed from YAML with the same
  random seed. Reference checkpoints are audit-only and are rejected as train inputs.
seed: 42
epochs: 100
imgsz: 640
batch: 16
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: false
patience: 100
amp: true
deterministic: true
workers: 2
augmentations:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  close_mosaic: 10
validation:
  split: val
  test_is_forbidden: true
smoke:
  epochs: 1
  fraction: 0.02
  batch: 16
