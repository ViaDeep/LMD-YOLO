experiment: stage10_lima
initialization: stage9_best_both
initialization_rationale: >-
  Ajuste con fotos de Lima tomadas desde la vereda con celular. Los dos modelos siguen desde su best.pt de la
  etapa 9. Para que no olviden RDD2022, cada época mezcla las fotos de Lima (repetidas lima_repeat veces) con
  una muestra fija del entrenamiento de la etapa 8, y la validación incluye China y los otros países.
# Dataset de la etapa 8 (de ahí salen la muestra de entrenamiento y las validaciones de China y otros países).
stage8_results_root: /content/drive/MyDrive/TP1_LMD/stage8/results
# Carpeta con el zip exportado de CVAT (formato Ultralytics YOLO); debe haber un solo .zip ahí.
lima_dir: /content/drive/MyDrive/TP1_LMD/stage10
# División fija 70/15/15 por clase principal (semilla 42), revisada antes de entrenar.
lima_split: configs/lima_split.json
lima_repeat: 6
# Las fotos se guardan ya giradas según su EXIF y con el lado mayor en 1280 px (el modelo trabaja en 640).
lima_max_side: 1280
rdd_train_sample: 1200
init_weights:
  lmd_yolo:
    drive_path: /content/drive/MyDrive/TP1_LMD/stage9/results/training/lmd_yolo/weights/best.pt
    sha256: 51ff6d1e37174311848dd56059b415278b7c19c9a96283c50fd4a30d6c2880a1
  yolov8n:
    drive_path: /content/drive/MyDrive/TP1_LMD/stage9/results/training/yolov8n/weights/best.pt
    sha256: a21ee91ae1c2c81295f7c61bcf054883b8b87abd9c4b11ba5a5597cc830130ea
seed: 42
epochs: 50
imgsz: 640
batch: 16
optimizer: SGD
# Tasa más baja que en las etapas 8 y 9: pocos datos nuevos y no se quiere borrar lo aprendido.
lr0: 0.002
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 1.0
warmup_momentum: 0.8
warmup_bias_lr: 0.01
cos_lr: false
patience: 100
amp: true
deterministic: true
workers: 2
augmentations:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  close_mosaic: 10
validation:
  split: val
  test_is_forbidden: true
smoke:
  epochs: 1
  fraction: 0.05
  batch: 16
